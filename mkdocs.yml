site_name: MiniMongoDB Tutorial
site_description: A chapter-oriented guide to document-database mechanisms in miniature
site_url: https://system-in-miniature.github.io/mini-mongodb/
repo_url: https://github.com/system-in-miniature/mini-mongodb
repo_name: system-in-miniature/mini-mongodb
docs_dir: docs

theme:
  name: material
  logo: assets/brand/avatar.svg
  favicon: assets/brand/avatar.svg
  features:
    - navigation.tabs
    - navigation.top
    - content.code.copy

extra_javascript:
  - assets/javascripts/language-switch.js

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.details
  - pymdownx.superfences
  - toc:
      permalink: true

nav:
  - Home: index.md
  - English:
      - Tutorial:
          - 01 · Meet MiniMongoDB: tutorial/01-getting-started.md
          - 02 · The Document Model: tutorial/02-document-model.md
          - 03 · Query Semantics: tutorial/03-queries.md
          - 04 · Update Operators: tutorial/04-updates.md
          - 05 · Durability and Recovery: tutorial/05-durability.md
          - 06 · The Oplog: tutorial/06-oplog.md
          - 07 · Secondary Indexes: tutorial/07-secondary-indexes.md
          - 08 · Planning and Explain: tutorial/08-planner-explain.md
          - 09 · Aggregation Pipelines: tutorial/09-aggregation.md
