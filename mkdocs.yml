site_name: MiniMongoDB Tutorial
site_description: A chapter-oriented guide to document-database mechanisms in miniature
site_url: https://system-in-miniature.github.io/mini-mongodb/
repo_url: https://github.com/system-in-miniature/mini-mongodb
repo_name: system-in-miniature/mini-mongodb
docs_dir: docs

theme:
  name: material
  logo: assets/brand/avatar.svg
  favicon: assets/brand/avatar.svg
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy

markdown_extensions:
  - admonition
  - attr_list
  - toc:
      permalink: true

nav:
  - English:
      - Chapter 1 · Quick start: index.md
      - Chapter 2 · Architecture overview: https://github.com/system-in-miniature/mini-mongodb#directory-guide
      - Chapter 3 · Mechanisms and MongoDB mapping: mapping.md
      - Chapter 4 · Hands-on experiments: labs-guide.md
      - Chapter 5 · Differences from MongoDB: DIFFERENCES.md
  - 中文版:
      - 第 1 章 · 快速开始: zh/index.md
      - 第 2 章 · 架构总览: https://github.com/system-in-miniature/mini-mongodb/blob/main/README.zh-CN.md
      - 第 3 章 · 机制与 MongoDB 映射: zh/mapping.md
      - 第 4 章 · 动手实验: zh/labs-guide.md
      - 第 5 章 · 与 MongoDB 的差异: zh/DIFFERENCES.md
  - Design history archive · 设计历史存档:
      - Archive notice · 存档说明: superpowers/README.md
      - M1 implementation plan: superpowers/plans/2026-07-30-minimongodb-m1.md
      - Final-audit design: superpowers/specs/2026-07-30-final-audit-correctness-design.md
      - Final-audit plan: superpowers/plans/2026-07-30-final-audit-correctness.md
