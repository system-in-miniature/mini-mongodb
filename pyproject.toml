[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "minimongodb"
version = "0.1.0"
description = "A deterministic document database kernel for teaching"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["pytest>=9,<10"]

[tool.hatch.build.targets.wheel]
packages = ["src/minimongodb"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
